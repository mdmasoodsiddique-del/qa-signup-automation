[pytest]
addopts = -v --html=reports/test_report.html --self-contained-html --junitxml=reports/junit.xml
testpaths = tests
markers =
    e2e: creates data on the live site and needs the email OTP (run only with RUN_E2E=1)
    validation: form validation checks
    navigation: page navigation checks
    duplicate: needs DUPLICATE_PHONE in .env
